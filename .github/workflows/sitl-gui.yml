name: sitl-gui

# Packages the SITL control GUI and the calibration capture GUI as
# executables for Linux/Windows and app bundles for macOS. The SITL binary is bundled
# with the control GUI so it runs the simulator out of the box;
# PyInstaller does not cross compile, so each platform builds its own.

on:
  push:
    paths: ["SITL/**", ".github/workflows/sitl-gui.yml"]
  pull_request:
    paths: ["SITL/**", ".github/workflows/sitl-gui.yml"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the firmware submodule
        run: git submodule update --init --depth 1 modules/am32-firmware

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                                  libdbus-1-3 libxcb-cursor0
          python3 -m pip install -r SITL/requirements.txt pyinstaller

      # the SITL is bundled so the GUI runs the simulator out of the box
      - name: Build SITL and GUI
        run: |
          make -C modules/am32-firmware AM32_SITL_CAN
          python3 SITL/build_sitl_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: am32-sitl-gui-linux
          path: dist/am32-sitl-gui

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out firmware and latest bootloader master
        run: |
          git submodule update --init --depth 1 modules/am32-firmware
          git submodule update --init --remote --depth 1 modules/am32-bootloader

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r SITL/requirements.txt pyinstaller

      - name: Route local DroneCAN multicast
        run: sudo route -n add -net 239.65.82.0/24 -interface lo0

      - name: Build firmware and bootloader
        run: |
          make -C modules/am32-firmware -j3 AM32_SITL_CAN
          make -C modules/am32-bootloader -j3 AM32_SITL_BOOTLOADER_PB4_CAN
          python3 SITL/bootloader_seed_test.py --bootloader modules/am32-bootloader/obj/AM32_SITL_BOOTLOADER_PB4_CAN_*.elf

      - name: Build macOS app and ZIP
        run: python3 SITL/package_macos.py

      - name: Test extracted release ZIP
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build/macos-unpacked
          ditto -x -k dist/am32-sitl-gui-macos-${{ matrix.arch }}.zip build/macos-unpacked
          app="build/macos-unpacked/am32-sitl-gui-macos-${{ matrix.arch }}/am32-sitl-gui.app"
          codesign --verify --deep --strict "$app"
          python3 SITL/windows_package_test.py --exe "$app"
          python3 SITL/multi_esc_gui_test.py
          python3 -m unittest discover -s SITL -t SITL -p 'test_*.py' -v

      # Keep the ZIP intact: artifact upload would discard Unix modes and
      # framework symlinks if it were given the unpacked .app directory.
      - uses: actions/upload-artifact@v4
        with:
          name: am32-sitl-gui-macos-${{ matrix.arch }}
          path: dist/am32-sitl-gui-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  # Windows is built under Cygwin rather than cross-compiled: the package
  # ships the firmware, the bootloader, the USB/IP installer and the
  # Cygwin runtime together, which is what the USB serial support needs
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the firmware submodule
        run: git submodule update --init --depth 1 modules/am32-firmware

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make python3 git

      - name: Build firmware, bootloader and Windows package
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          python3 SITL/build_win11.py --local --python "$(cygpath -u "$NATIVE_PYTHON")"

      # Upload the common staging directory: GitHub's downloadable artifact
      # ZIP contains exactly the files in the ZIP produced on win11, without
      # wrapping another ZIP inside it.
      - uses: actions/upload-artifact@v4
        with:
          name: am32-sitl-gui-windows
          path: dist/windows-package/
          if-no-files-found: error

  capture-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: am32-capture-linux
            binary: dist/am32-capture
          - os: windows-latest
            artifact: am32-capture-windows
            binary: dist/am32-capture.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                                  libdbus-1-3 libxcb-cursor0

      - name: Install build dependencies
        # a clean environment on purpose: building against a system
        # python that has other Qt bindings or unrelated packages
        # installed inflates the bundle several times over
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r SITL/scripts/requirements-capture-gui.txt pyinstaller
          python3 -m pip uninstall -y matplotlib || true

      - name: Build executable
        run: python3 SITL/scripts/build_capture_gui.py

      # runs on both: the Windows binary is the one end users get, and
      # the frozen multiprocessing path that mavcan needs behaves
      # differently there
      - name: Smoke test the executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 SITL/scripts/capture_gui_test.py --binary ${{ matrix.binary }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
